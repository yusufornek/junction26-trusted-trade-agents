  /v1/agents/{agent_id}/track-record:
    get:
      summary: Track Record
      description: Audit-derived record for orders placed in window_days (default
        30). Operator, the agent and its buyer organisation may read it. Readiness
        is advisory; no automatic promotion.
      operationId: track_record_v1_agents__agent_id__track_record_get
      security:
      - BearerAuth: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: window_days
        in: query
        required: false
        schema:
          type: integer
          maximum: 3650
          minimum: 1
          default: 30
          title: Window Days
