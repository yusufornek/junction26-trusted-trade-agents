    OfferCard:
      properties:
        product_id:
          type: string
          title: Product Id
        gtin:
          anyOf:
          - type: string
          - type: 'null'
          title: Gtin
          description: GS1 GTIN of the sales unit, from salesUnitGtin.
        name:
          type: string
          title: Name
        sales_unit:
          type: string
          title: Sales Unit
        allowed_lot_size:
          type: number
          minimum: 1.0
          title: Allowed Lot Size
          description: Effective whole sales-unit step used by this offer and its
            plans, including KG.
          default: 1
        size_per_sales_unit:
          anyOf:
          - type: number
          - type: 'null'
          title: Size Per Sales Unit
          description: Positive quantity unit per sales unit, quantized to six decimal
            places before pack arithmetic; CASE content already includes its multiplier.
            Nested name counts retain inner packages; slash portion counts preserve
            package totals and net/drained names use net weight. With contradictory
            catalog/name evidence and no price ratio, SIZE_MISMATCH reports both sizes
            and retains the plausible catalog package total requiring approval. A
            name from either language can replace it when the live ratio confirms
            that name within 3%. Null when conversion is unknown.
        size_unit:
          type: string
          enum:
          - L
          - KG
          - SALES_UNIT
          title: Size Unit
        size_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Size Source
          description: price_ratio, catalog, name_parse, base_unit or sales_unit.
        size_confirmed_by_price:
          type: boolean
          title: Size Confirmed By Price
          description: True when the live price ratio agrees with the selected exact
            catalog or name size within 3%.
          default: false
        units_needed:
          anyOf:
          - type: number
          - type: 'null'
          title: Units Needed
          description: Whole sales units rounded to the effective allowed lot step,
            including KG.
        unit_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Unit Price
          description: Net catalog price per sales unit, fixed on quote creation.
        unit_price_with_tax:
          anyOf:
          - type: number
          - type: 'null'
          title: Unit Price With Tax
        price_per_l_or_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Price Per L Or Kg
        total:
          anyOf:
          - type: number
          - type: 'null'
          title: Total
          description: Net line total in currency.
        purchase_total:
          anyOf:
          - type: number
          - type: 'null'
          title: Purchase Total
          description: Net cost of all sales units needed to cover the request, including
            overbuy; unit_price is per sales unit.
        overbuy:
          anyOf:
          - $ref: '#/components/schemas/Overbuy'
          - type: 'null'
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
          description: Upstream currency; missing currency is a PRICE_ERROR.
        valid_from:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid From
        valid_to:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid To
        net_price_found:
          type: boolean
          title: Net Price Found
          default: false
        availability:
          $ref: '#/components/schemas/Availability'
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
        delivery_reliability:
          anyOf:
          - type: number
          - type: 'null'
          title: Delivery Reliability
        co2_kg_per_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Co2 Kg Per Kg
        labels:
          items:
            type: string
          type: array
          title: Labels
        matched_because:
          items:
            type: string
          type: array
          title: Matched Because
        fit:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Fit
          description: Decisions predicate probability; never inferred from a name
            alone.
        fit_question:
          anyOf:
          - type: string
          - type: 'null'
          title: Fit Question
        provenance:
          additionalProperties:
            $ref: '#/components/schemas/Provenance'
          type: object
          title: Provenance
        score:
          type: number
          title: Score
          default: 0
        score_breakdown:
          additionalProperties:
            type: number
          type: object
          title: Score Breakdown
          description: Weighted price, coverage, reliability, co2 and fit contributions;
            sums to score.
        rank_label:
          anyOf:
          - type: string
            enum:
            - best
            - better
            - good
          - type: 'null'
          title: Rank Label
      additionalProperties: false
      type: object
      required:
      - product_id
      - name
      - sales_unit
      - size_unit
      - availability
      - provenance
      title: OfferCard
    Order:
      properties:
        context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Context
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
