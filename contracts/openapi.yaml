          type: string
          title: Issuer
        limits:
          additionalProperties:
            type: number
          type: object
          title: Limits
        valid_until:
          type: string
          format: date-time
          title: Valid Until
        autonomy:
          anyOf:
          - type: string
            enum:
            - approval_required
            - autonomous_within_limits
          - type: 'null'
          title: Autonomy
