openapi: 3.1.0
info:
  title: Valio Aimo Trusted Trade Agents
  description: Fixed-price gateway. REST, MCP and A2A 1.0 share one core. Signed webhooks
    deliver decisions independently of purchasing state. Bearer credentials establish
    agent ownership and operator authority. Keyed writes bind the principal, command
    route including all targets, and payload. Every exact replay rechecks current
    authorization and scope before returning its saved result. Policy changes commit
    with their audit and command result; runtime YAML is published only after commit,
    with durable recovery from SQLite. Commitments are gateway-simulated.
  version: 0.1.0
paths:
