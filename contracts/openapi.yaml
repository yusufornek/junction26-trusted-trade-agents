  /a2a:
    post:
      tags:
      - 'A2A: JSON-RPC'
      summary: A2A JSON-RPC endpoint
      description: 'A2A JSON-RPC 2.0 endpoint. The `method` field selects the operation;

        `params` must match that method''s schema (see the `oneOf` below).


        **Supported methods:**


        - `SendMessage` — Send a message to the agent (returns a Task or response
        Message).

        - `SendStreamingMessage` — Send a message and receive a Server-Sent Events
        stream.

        - `GetTask` — Fetch a task by ID.

        - `ListTasks` — List tasks with pagination and filtering.

        - `CancelTask` — Cancel an in-progress task.

        - `CreateTaskPushNotificationConfig` — Register a push-notification config
        on a task.

        - `GetTaskPushNotificationConfig` — Read a single push-notification config.

        - `ListTaskPushNotificationConfigs` — List all push-notification configs for
        a task.

        - `DeleteTaskPushNotificationConfig` — Delete a push-notification config.

        - `SubscribeToTask` — Subscribe to task events via Server-Sent Events.

        - `GetExtendedAgentCard` — Fetch the authenticated extended agent card.

        '
      operationId: handle_requests_a2a_post
      responses:
        '200':
          description: A2A 1.0 JSON-RPC response, or SSE StreamResponse events.
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
      requestBody:
        description: A2A JSON-RPC 2.0 request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2ARequest'
      parameters:
      - in: header
        name: A2A-Version
        required: true
        schema:
          type: string
          enum:
          - '1.0'
        example: '1.0'
      security:
      - BearerAuth: []
