          type: string
          title: Idempotency Key
        status:
          type: string
          enum:
          - CONFIRMED
          - PENDING_APPROVAL
          - REJECTED
          - EXPIRED
          - CANCELLED
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
