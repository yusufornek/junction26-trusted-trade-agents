        alg:
          type: string
          const: EdDSA
          title: Alg
        use:
          type: string
          const: sig
          title: Use
        x:
          type: string
          title: X
      additionalProperties: false
      type: object
      required:
      - kid
      - kty
      - crv
      - alg
      - use
      - x
      title: PublicJWK
    Quantity:
      properties:
        value:
          type: number
          maximum: 1000000.0
          exclusiveMinimum: 0.0
          title: Value
          description: Requested positive quantity, at most 1,000,000.
        unit:
          type: string
          enum:
          - L
          - KG
          - SALES_UNIT
          title: Unit
          description: Litres, kilograms or product sales units.
      additionalProperties: false
      type: object
      required:
      - value
      - unit
      title: Quantity
    Quote:
      properties:
        links:
          additionalProperties: true
          type: object
          title: Links
        context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Context
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        mandate:
          anyOf:
          - $ref: '#/components/schemas/MandateRecord'
          - type: 'null'
        id:
          type: string
          title: Id
        signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature
          description: 'Detached RFC 7515 EdDSA JWS over the spec 10/13 RFC 8785 payload:
            id, customer_id, deliver_by, lines (product_id, decimal-string units and
            unit_price, currency, gtin, provenance), decimal-string total, expires_at,
            price_commitment. Protected header: alg, kid, quote_version=2, quote_integrity
            (SHA-256 of canonical immutable quote fields, excluding signature/status/live_calls,
            numbers as decimal strings). Earlier unversioned spec and expanded-integrity
            signatures remain verifiable and usable until expiry. Public keys: /.well-known/jwks.json.
            Unsigned legacy quotes require re-quoting; existing orders remain replayable.'
        price_commitment:
          type: string
          const: gateway-locked
          title: Price Commitment
          description: Gateway holds the fixed price until expires_at; included in
            the signature.
          default: gateway-locked
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
          description: Creating agent; legacy unowned records are operator-only.
        customer_id:
          type: string
          title: Customer Id
        deliver_by:
          type: string
          format: date
          title: Deliver By
        need_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Need Ref
        plan_ref:
          anyOf:
          - $ref: '#/components/schemas/PlanRef'
          - type: 'null'
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
          description: Plan-level risks, including an uncovered part of the original
            need; retained through ordering.
        status:
          type: string
          enum:
          - OPEN
          - ACCEPTED
          - EXPIRED
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: Earliest price validity, future cutoff or 30 minutes after
            creation.
        lines:
          items:
            $ref: '#/components/schemas/OfferCard'
          type: array
          title: Lines
          description: Fixed-price lines; units_needed is the quoted sales quantity.
        total:
          type: number
          title: Total
        currency:
          type: string
          title: Currency
        hard_constraint_violations:
          items:
            type: string
          type: array
          title: Hard Constraint Violations
        live_calls:
          $ref: '#/components/schemas/LiveCalls'
      additionalProperties: false
      type: object
      required:
      - id
      - customer_id
      - deliver_by
      - status
      - created_at
      - expires_at
      - lines
      - total
      - currency
      - live_calls
      title: Quote
    QuoteLineRequest:
      properties:
        product_id:
          type: string
          minLength: 1
          title: Product Id
        quantity_sales_units:
          type: number
          maximum: 1000000.0
          exclusiveMinimum: 0.0
          title: Quantity Sales Units
          description: Explicit whole sales quantity, at most 1,000,000, in allowedLotSize
            steps (minimum one), including KG; fractional lots return INVALID_LOT_SIZE.
      additionalProperties: false
      type: object
      required:
      - product_id
      - quantity_sales_units
      title: QuoteLineRequest
    QuoteRequest:
      properties:
        customer_id:
          type: string
          minLength: 1
          title: Customer Id
          description: Required non-blank Valio customer identifier.
        deliver_by:
          type: string
          format: date
          title: Deliver By
          description: Delivery date between today and today + 60 days, Europe/Helsinki.
        lines:
          anyOf:
          - items:
              $ref: '#/components/schemas/QuoteLineRequest'
            type: array
            maxItems: 10
            minItems: 1
          - type: 'null'
          title: Lines
        plan_ref:
          anyOf:
          - $ref: '#/components/schemas/PlanRef'
          - type: 'null'
          description: Alternative to explicit lines; recheck a stored plan live.
            Exactly one of lines or plan_ref is required.
        need_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Need Ref
          description: 'Required with explicit lines: stored lookup_id binding fit,
            preferences and current customer constraints. Otherwise 422 NEED_REF_REQUIRED.'
      additionalProperties: false
      type: object
      required:
      - customer_id
      - deliver_by
      title: QuoteRequest
    RankingWeights:
      properties:
        price:
          type: number
          minimum: 0.0
          title: Price
        coverage:
          type: number
          minimum: 0.0
          title: Coverage
        reliability:
          type: number
          minimum: 0.0
          title: Reliability
        co2:
          type: number
          minimum: 0.0
          title: Co2
        fit:
          type: number
          minimum: 0.0
          title: Fit
      additionalProperties: false
      type: object
      required:
      - price
      - coverage
      - reliability
      - co2
      - fit
      title: RankingWeights
    RateLimits:
      properties:
        lookup:
          $ref: '#/components/schemas/BucketPolicy'
        mutation:
          $ref: '#/components/schemas/BucketPolicy'
        read:
          $ref: '#/components/schemas/BucketPolicy'
      additionalProperties: false
      type: object
      title: RateLimits
    RejectPolicy:
      properties:
        on_hard_constraint_violation:
          type: boolean
          title: On Hard Constraint Violation
          description: Reject request hard-constraint failures; false routes them
            to approval. Customer standing constraints always reject.
        'on':
          items:
            type: string
          type: array
          title: 'On'
          description: Known warning codes causing rejection.
      additionalProperties: false
      type: object
      required:
      - on_hard_constraint_violation
      - 'on'
      title: RejectPolicy
    Retrieval:
      properties:
        mode:
          type: string
          enum:
          - terms
          - intent
          - intent_broadened
          title: Mode
          default: intent
        terms_used:
          items:
            type: string
          type: array
          title: Terms Used
          description: Search words or phrases actually tried; broadened terms are
            lower-case and omit numbers, units and stop words.
      additionalProperties: false
      type: object
      title: Retrieval
    RevocationRequest:
      properties:
        jwt:
          type: string
          minLength: 1
          title: Jwt
          description: Buyer-signed EdDSA JWT containing iss, jti_revoked and iat.
      additionalProperties: false
      type: object
      required:
      - jwt
      title: RevocationRequest
    RuleCount:
      properties:
        rule:
          type: string
          title: Rule
          description: Placement policy rule identifier.
        count:
          type: integer
          title: Count
          description: Rule-hit occurrences in PLACE_ORDER audit events.
      additionalProperties: false
      type: object
      required:
      - rule
      - count
      title: RuleCount
    RuleHit:
      properties:
        rule:
          type: string
          title: Rule
        detail:
          type: string
          title: Detail
      additionalProperties: false
      type: object
      required:
      - rule
      - detail
      title: RuleHit
    ShortlistPolicy:
      properties:
        catalog_pool:
          type: integer
          maximum: 100.0
          minimum: 10.0
          title: Catalog Pool
          description: Catalog candidates screened before live Valio calls.
        live_max:
          type: integer
          maximum: 40.0
          minimum: 10.0
          title: Live Max
          description: Maximum suitable candidates priced before returning the top
            offers.
          default: 25
      additionalProperties: false
      type: object
      required:
      - catalog_pool
      title: ShortlistPolicy
    Stats:
      properties:
        throttles:
          type: integer
          title: Throttles
          default: 0
        upstream_rate_limits:
          type: integer
          title: Upstream Rate Limits
          description: Valio HTTP 429 blocks started in the reporting window; one
            audit event per block.
          default: 0
        since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
          description: Inclusive UTC lower bound; naive input is interpreted as UTC.
            Null means all history.
        lookups:
          type: integer
          title: Lookups
          description: LOOKUP audit events in the window.
        orders_by_status:
          additionalProperties:
            type: integer
          type: object
          title: Orders By Status
          description: Current statuses of orders created in the window, including
            zero counts.
        placement_outcomes:
          additionalProperties:
            type: integer
          type: object
          title: Placement Outcomes
          description: Original CONFIRMED/PENDING_APPROVAL/REJECTED outcomes from
            PLACE_ORDER events in the window; retries excluded.
        human_decisions:
          $ref: '#/components/schemas/HumanDecisions'
          description: Successful human decisions by event time, even for older orders.
        confirmed_spend_total_eur:
          type: number
          title: Confirmed Spend Total Eur
          description: Net EUR total of currently CONFIRMED orders created in the
            window.
        average_live_calls_per_lookup:
          $ref: '#/components/schemas/AverageLiveCalls'
          description: Lookup-only outbound Valio request averages; quote and order
            checks excluded.
        total_decisions_calls:
          type: integer
          title: Total Decisions Calls
          description: Actual Decisions HTTP requests recorded in audit events in
            the window.
        top_warning_codes:
          items:
            $ref: '#/components/schemas/WarningCount'
          type: array
          title: Top Warning Codes
          description: Top five offer warning codes in lookups in the window; count
            descending, code ascending on ties.
        top_rule_hits:
          items:
            $ref: '#/components/schemas/RuleCount'
          type: array
          title: Top Rule Hits
          description: Top five placement rule hits; count descending, rule ascending
            on ties.
        agents_seen:
          items:
            $ref: '#/components/schemas/AgentStats'
          type: array
          title: Agents Seen
          description: Agent actors seen in audit events in the window, sorted by
            actor, with order counts.
      additionalProperties: false
      type: object
      required:
      - since
      - lookups
      - orders_by_status
      - placement_outcomes
      - human_decisions
      - confirmed_spend_total_eur
      - average_live_calls_per_lookup
      - total_decisions_calls
      - top_warning_codes
      - top_rule_hits
      - agents_seen
      title: Stats
    TimelineStep:
      properties:
        hash:
          type: string
          title: Hash
          description: SHA-256 hash of this step's audit entry in the gateway chain.
          default: ''
        ts:
          type: string
          format: date-time
          title: Ts
          description: UTC audit event time; steps are oldest first, with audit ID
            breaking ties.
        actor:
          type: string
          title: Actor
          description: Recorded actor, such as agent:buyer, human:Ada or system.
        action:
          type: string
          title: Action
          description: Original audit action, including EVIDENCE_CHANGED, replays
            and failed attempts.
        step:
          type: string
          enum:
          - lookup
          - quote
          - order
          - decision
          - cancellation
          - system
          title: Step
          description: Human-facing stage of the order lifecycle.
        summary:
          type: string
          title: Summary
          description: Original human-readable audit summary.
        data:
          additionalProperties: true
          type: object
          title: Data
          description: Unmodified audit payload, including inputs, evidence and policy
            rule hits.
        live_calls:
          $ref: '#/components/schemas/LiveCalls'
          description: Actual Valio requests for this event; absent audit counts default
            to zero.
        decision_calls:
          type: integer
          title: Decision Calls
          description: Actual Decisions requests for this event; absent audit counts
            default to zero.
          default: 0
      additionalProperties: false
      type: object
      required:
      - ts
      - actor
      - action
      - step
      - summary
      - data
      title: TimelineStep
    UpstreamHealth:
      properties:
        blocked_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Blocked Until
          description: UTC end of the process-wide Valio 429 block, or null when unblocked.
        calls_last_minute:
          type: integer
          minimum: 0.0
          title: Calls Last Minute
          description: Actual outbound Valio calls in the preceding 60 seconds, across
            this process.
          default: 0
      additionalProperties: false
      type: object
      title: UpstreamHealth
    Warning:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine-readable warning code.
        text:
          type: string
          title: Text
          description: Human-readable explanation.
      additionalProperties: false
      type: object
      required:
      - code
      - text
      title: Warning
    WarningCount:
      properties:
        code:
          type: string
          title: Code
          description: Warning code found on a stored lookup offer.
        count:
          type: integer
          title: Count
          description: Occurrences across offers, excluding lookup-level duplicates.
      additionalProperties: false
      type: object
      required:
      - code
      - count
      title: WarningCount
  securitySchemes:
    BearerAuth:
      type: http
      description: Operator-issued agent key or operator token.
      scheme: bearer
