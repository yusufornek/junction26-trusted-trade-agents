        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(latest|0x[0-9a-fA-F]{64})$
          - type: 'null'
          title: Anchor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying the same command, when retryable.
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying the same command, when retryable.
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying the same command, when retryable.
components:
  schemas:
    AgentMandate:
      properties:
        autonomy:
          anyOf:
          - type: string
            enum:
            - approval_required
            - autonomous_within_limits
          - type: 'null'
          title: Autonomy
          description: Omission uses policy.autonomy.default; new agents require sign-off
            by default.
        rate_limits:
          anyOf:
          - $ref: '#/components/schemas/RateLimits'
          - type: 'null'
        customer_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Customer Ids
          description: Customers this agent may quote and order for.
        max_auto_total_eur:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Max Auto Total Eur
          description: Optional per-order ceiling; the lower of this and the global
            ceiling applies.
        max_auto_daily_total_eur:
          type: number
          minimum: 0.0
          title: Max Auto Daily Total Eur
          description: Rolling 24-hour autonomous EUR ceiling; cancelled and human-approved
            orders are excluded.
        note:
          type: string
          title: Note
          description: Free-text record of who granted the mandate.
          default: ''
      additionalProperties: false
      type: object
      required:
      - customer_ids
      - max_auto_daily_total_eur
      title: AgentMandate
    AgentStats:
      properties:
        actor:
          type: string
          title: Actor
          description: 'Distinct agent audit actor, including the agent: prefix.'
        order_count:
          type: integer
          title: Order Count
          description: Orders created by this agent in the window, regardless of current
            status.
        registered:
          type: boolean
          title: Registered
          description: Whether the agent currently has a policy mandate or a valid,
            trusted, unrevoked buyer credential.
        mandate_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Mandate Id
          description: Currently valid buyer mandate in use; historical IDs remain
            on objects and audit entries.
      additionalProperties: false
      type: object
      required:
      - actor
      - order_count
      - registered
      title: AgentStats
    AgentTrackRecord:
      properties:
        agent_id:
          type: string
          title: Agent Id
        window_days:
          type: integer
          title: Window Days
        window_start:
          type: string
          format: date-time
          title: Window Start
        window_end:
          type: string
          format: date-time
          title: Window End
        orders_placed:
          type: integer
          title: Orders Placed
        approved_unchanged:
          type: integer
          title: Approved Unchanged
        rejected:
          type: integer
          title: Rejected
        expired:
          type: integer
          title: Expired
        evidence_changes:
          type: integer
          title: Evidence Changes
        cancellations:
          type: integer
          title: Cancellations
        hard_constraint_refusals:
          type: integer
          title: Hard Constraint Refusals
        average_approval_time_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Approval Time Seconds
        approved_unchanged_share:
          type: number
          title: Approved Unchanged Share
        rejection_share:
          type: number
          title: Rejection Share
        last_rejection_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Rejection At
        last_hard_constraint_refusal_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Hard Constraint Refusal At
        autonomy_recommendation:
          $ref: '#/components/schemas/AutonomyRecommendation'
      additionalProperties: false
      type: object
      required:
      - agent_id
      - window_days
      - window_start
      - window_end
      - orders_placed
      - approved_unchanged
      - rejected
      - expired
      - evidence_changes
      - cancellations
      - hard_constraint_refusals
      - average_approval_time_seconds
      - approved_unchanged_share
      - rejection_share
      - last_rejection_at
      - last_hard_constraint_refusal_at
      - autonomy_recommendation
      title: AgentTrackRecord
    ApprovalItem:
      properties:
        order:
          $ref: '#/components/schemas/Order'
        quote:
          $ref: '#/components/schemas/Quote'
      additionalProperties: false
      type: object
      required:
      - order
      - quote
      title: ApprovalItem
    ApprovalPolicy:
      properties:
        max_auto_total_eur:
          type: number
          minimum: 0.0
          title: Max Auto Total Eur
          description: Net EUR ceiling for automatic confirmation.
        min_fit_probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Fit Probability
          description: Minimum fit probability for automatic confirmation.
        warnings_need_approval:
          items:
            type: string
          type: array
          title: Warnings Need Approval
          description: Known warning codes requiring human review.
        ignored_warnings:
          items:
            type: string
          type: array
          title: Ignored Warnings
          description: Only these warnings may be ignored; all other non-reject warnings
            require approval.
      additionalProperties: false
      type: object
      required:
      - max_auto_total_eur
      - min_fit_probability
      - warnings_need_approval
      title: ApprovalPolicy
    ApprovalRequest:
      properties:
        approver:
          type: string
          minLength: 1
          title: Approver
          description: 'Human approver name (MVP: one role, no authentication).'
        comment:
          type: string
          title: Comment
          default: ''
        evidence_revision:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Evidence Revision
          description: Optional revision displayed to the approver. A stale revision
            prevents approval with 409 EVIDENCE_CHANGED before any upstream call;
            ignored for rejection.
      additionalProperties: false
      type: object
      required:
      - approver
      title: ApprovalRequest
    AuditAnchor:
      properties:
        entries:
          type: integer
          title: Entries
        head_hash:
          type: string
          title: Head Hash
        chain_id:
          type: integer
          title: Chain Id
        tx_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Tx Hash
        block_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Block Number
        status:
          type: string
          enum:
          - sent
          - confirmed
          - failed
          title: Status
        explorer_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Explorer Url
        at:
          type: string
          format: date-time
          title: At
      additionalProperties: false
      type: object
      required:
      - entries
      - head_hash
      - chain_id
      - status
      - at
      title: AuditAnchor
    AuditEntry:
      properties:
        id:
          type: integer
          title: Id
        prev_hash:
          type: string
          title: Prev Hash
          default: ''
        hash:
          type: string
          title: Hash
          default: ''
        ts:
          type: string
          title: Ts
          description: Exact stored timestamp string used in the audit hash; preserve
            its UTC offset spelling for independent verification.
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Order Id
        quote_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote Id
        summary:
          type: string
          title: Summary
        data:
          additionalProperties: true
          type: object
          title: Data
      additionalProperties: false
      type: object
      required:
      - id
      - ts
      - actor
      - action
      - order_id
      - quote_id
      - summary
      - data
      title: AuditEntry
    AuditHead:
      properties:
        entries:
          type: integer
          title: Entries
        head_hash:
          type: string
          title: Head Hash
        at:
          type: string
          title: At
        jws:
          type: string
          title: Jws
          description: Detached Ed25519 JWS over canonical {entries, head_hash, at};
            keep outside the gateway as a checkpoint.
      additionalProperties: false
      type: object
      required:
      - entries
      - head_hash
      - at
      - jws
      title: AuditHead
    AuditVerification:
      properties:
        valid:
          type: boolean
          title: Valid
        entries:
          type: integer
          title: Entries
        head_hash:
          type: string
          title: Head Hash
        first_break:
          anyOf:
          - type: integer
          - type: 'null'
          title: First Break
        checkpoint_match:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Checkpoint Match
        anchor_match:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Anchor Match
        anchor_block_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Anchor Block Time
      additionalProperties: false
      type: object
      required:
      - valid
      - entries
      - head_hash
      title: AuditVerification
    AutonomyChange:
      properties:
        level:
          type: string
          enum:
          - approval_required
          - autonomous_within_limits
          title: Level
        reason:
          type: string
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - level
      - reason
      title: AutonomyChange
    AutonomyChangeResult:
      properties:
        agent_id:
          type: string
          title: Agent Id
        level:
          type: string
          enum:
          - approval_required
          - autonomous_within_limits
          title: Level
        reason:
          type: string
          title: Reason
        track_record:
          $ref: '#/components/schemas/AgentTrackRecord'
      additionalProperties: false
      type: object
      required:
      - agent_id
      - level
      - reason
      - track_record
      title: AutonomyChangeResult
    AutonomyPolicy:
      properties:
        default:
          type: string
          enum:
          - approval_required
          - autonomous_within_limits
          title: Default
          default: approval_required
        promotion:
          $ref: '#/components/schemas/AutonomyPromotion'
      additionalProperties: false
      type: object
      title: AutonomyPolicy
    AutonomyPromotion:
      properties:
        min_approved_unchanged:
          type: integer
          minimum: 0.0
          title: Min Approved Unchanged
          default: 5
        max_rejection_share:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Max Rejection Share
          default: 0.1
        days_since_last_rejection_or_refusal:
          type: integer
          minimum: 0.0
          title: Days Since Last Rejection Or Refusal
          default: 7
      additionalProperties: false
      type: object
      title: AutonomyPromotion
    AutonomyRecommendation:
      properties:
        eligible:
          type: boolean
          title: Eligible
        reasons:
          items:
            type: string
          type: array
          title: Reasons
      additionalProperties: false
      type: object
      required:
      - eligible
      - reasons
      title: AutonomyRecommendation
    Availability:
      properties:
        available_amount:
          anyOf:
          - type: number
          - type: 'null'
          title: Available Amount
          description: On-time sales units after local reservations; null when an
            upstream amount >= 999999 means unknown but orderable.
        availability_known:
          type: boolean
          title: Availability Known
          description: False for upstream amounts >= 999999, independently of logistic
            model; no local reservation is counted.
          default: true
        logistic_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Logistic Model
        closing_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Closing Time
        available_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Available Date
          description: Earliest unblocked upstream delivery date.
        enough:
          type: boolean
          title: Enough
        coverage:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Coverage
          description: Fraction of requested sales units covered by on-time stock.
      additionalProperties: false
      type: object
      required:
      - available_amount
      - enough
      - coverage
      title: Availability
    AverageLiveCalls:
      properties:
        price:
          type: number
          title: Price
          description: Actual price requests divided by lookups in the window; zero
            without lookups.
        availability:
          type: number
          title: Availability
          description: Actual availability requests divided by lookups in the window;
            zero without lookups.
      additionalProperties: false
      type: object
      required:
      - price
      - availability
      title: AverageLiveCalls
    BucketPolicy:
      properties:
        capacity:
          type: integer
          exclusiveMinimum: 0.0
          title: Capacity
        refill_per_minute:
          type: number
          exclusiveMinimum: 0.0
          title: Refill Per Minute
      additionalProperties: false
      type: object
      required:
      - capacity
      - refill_per_minute
      title: BucketPolicy
    BuyerJWK:
      properties:
        kty:
          type: string
          const: OKP
          title: Kty
          default: OKP
        crv:
          type: string
          const: Ed25519
          title: Crv
          default: Ed25519
        x:
          type: string
          title: X
        kid:
          type: string
          title: Kid
        alg:
          type: string
          const: EdDSA
          title: Alg
          default: EdDSA
        use:
          type: string
          const: sig
          title: Use
          default: sig
      additionalProperties: false
      type: object
      required:
      - x
      - kid
      title: BuyerJWK
    CancelRequest:
      properties:
        cancelled_by:
          type: string
          minLength: 1
          title: Cancelled By
          description: Non-blank human name responsible for cancellation.
        reason:
          type: string
          title: Reason
          default: ''
      additionalProperties: false
      type: object
      required:
      - cancelled_by
      title: CancelRequest
    ConstraintSource:
      properties:
        code:
          type: string
          title: Code
        source:
          type: string
          enum:
          - request
          - customer_policy
          title: Source
      additionalProperties: false
      type: object
      required:
      - code
      - source
      title: ConstraintSource
    CoveredQuantity:
      properties:
        value:
          type: number
          minimum: 0.0
          title: Value
        unit:
          type: string
          enum:
          - L
          - KG
          - SALES_UNIT
          title: Unit
      additionalProperties: false
      type: object
      required:
      - value
      - unit
      title: CoveredQuantity
    CustomerConstraints:
      properties:
        mandate_issuers:
          additionalProperties:
            items:
              $ref: '#/components/schemas/BuyerJWK'
            type: array
          type: object
          title: Mandate Issuers
          description: Trusted buyer issuer IDs mapped to public Ed25519 JWKs; operator
            onboarding only.
        required_claims:
          items:
            type: string
          type: array
          title: Required Claims
        exclude_allergens:
          items:
            type: string
          type: array
          title: Exclude Allergens
        note:
          type: string
          title: Note
          default: ''
      additionalProperties: false
      type: object
      title: CustomerConstraints
    EffectiveConstraints:
      properties:
        required_claims:
          items:
            $ref: '#/components/schemas/ConstraintSource'
          type: array
          title: Required Claims
        exclude_allergens:
          items:
            $ref: '#/components/schemas/ConstraintSource'
          type: array
          title: Exclude Allergens
      additionalProperties: false
      type: object
      title: EffectiveConstraints
    ErrorResponse:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        instance:
          type: string
          title: Instance
        recovery_version:
          type: integer
          const: 1
          title: Recovery Version
          default: 1
        retryable:
          type: boolean
          title: Retryable
        next_action:
          type: string
          enum:
          - RETRY_SAME_COMMAND
          - REFRESH_QUOTE
          - LOOKUP_REQUIRED
          - WAIT_FOR_APPROVAL
          - REVIEW_UPDATED_EVIDENCE
          - FIX_REQUEST
          - CONTACT_ADMIN
          - STOP
          title: Next Action
        retry_after_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After Seconds
        resource_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Ref
        correlation_id:
          type: string
          title: Correlation Id
        violations:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Violations
        code:
          type: string
          title: Code
          description: Stable domain error code, e.g. EXPIRED_QUOTE.
        message:
          type: string
          title: Message
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: Additional error evidence, including approval rule_hits when
            available.
      additionalProperties: false
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - retryable
      - next_action
      - correlation_id
      - code
      - message
      title: ErrorResponse
    FulfilmentPlan:
      properties:
        kind:
          type: string
          enum:
          - single
          - split
          - partial
          title: Kind
        lines:
          items:
            $ref: '#/components/schemas/PlanLine'
          type: array
          maxItems: 4
          minItems: 1
          title: Lines
        total:
          type: number
          minimum: 0.0
          title: Total
          description: Sum of fixed net EUR line totals at lookup time.
        coverage:
          $ref: '#/components/schemas/CoveredQuantity'
          description: Sum of line covers in the need's unit; whole packs may over-cover.
        uncovered:
          $ref: '#/components/schemas/CoveredQuantity'
          description: Requested quantity still missing by the deadline; zero for
            a complete plan.
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
        policy_preview:
          $ref: '#/components/schemas/PolicyResult'
          description: Side-effect-free current policy evaluation for the caller,
            including mandate and daily limits. Stock and policy may change before
            placement; the order result is authoritative.
      additionalProperties: false
      type: object
      required:
      - kind
      - lines
      - total
      - coverage
      - uncovered
      - policy_preview
      title: FulfilmentPlan
    Health:
      properties:
        status:
          type: string
          title: Status
        catalog_rows:
          type: integer
          title: Catalog Rows
        coverage:
          additionalProperties:
            additionalProperties:
              type: integer
            type: object
          type: object
          title: Coverage
          description: 'Catalog build coverage: filled and empty counts per field.'
        anchoring:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Anchoring
        upstream:
          $ref: '#/components/schemas/UpstreamHealth'
      additionalProperties: false
      type: object
      required:
      - status
      - catalog_rows
      title: Health
    HumanDecisions:
      properties:
        approved:
          type: integer
          title: Approved
          description: Successful human APPROVE audit events in the window.
        rejected:
          type: integer
          title: Rejected
          description: Successful human REJECT audit events in the window.
      additionalProperties: false
      type: object
      required:
      - approved
      - rejected
      title: HumanDecisions
    IdentityPolicy:
      properties:
        kind:
          type: string
          enum:
          - agent
          - operator
          - buyer_user
          - supplier_agent
          title: Kind
          default: agent
        organisation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Organisation Id
        role:
          type: string
          enum:
          - agent
          - valio_operator
          - buyer_admin
          - buyer_approver
          - buyer_viewer
          - supplier_agent
          title: Role
          default: agent
      additionalProperties: false
      type: object
      title: IdentityPolicy
    JWKSet:
      properties:
        keys:
          items:
            $ref: '#/components/schemas/PublicJWK'
          type: array
          title: Keys
      additionalProperties: false
      type: object
      required:
      - keys
      title: JWKSet
    LiveCalls:
      properties:
        price:
          type: integer
          title: Price
          description: Actual outbound price HTTP requests, including failed attempts.
          default: 0
        availability:
          type: integer
          title: Availability
          description: Actual outbound availability HTTP requests.
          default: 0
      additionalProperties: false
      type: object
      title: LiveCalls
    LookupResult:
      properties:
        links:
          additionalProperties: true
          type: object
          title: Links
        context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Context
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        mandate:
          anyOf:
          - $ref: '#/components/schemas/MandateRecord'
          - type: 'null'
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
          description: Creating agent; legacy unowned records are operator-only.
        lookup_id:
          type: string
          title: Lookup Id
          description: Server-side need reference; pass as need_ref when quoting to
            preserve fit and constraints.
        need:
          $ref: '#/components/schemas/NeedSpec'
        effective_constraints:
          $ref: '#/components/schemas/EffectiveConstraints'
        exclusion_counts:
          additionalProperties:
            type: integer
          type: object
          title: Exclusion Counts
          description: Removal counts by constraint source and evidence reason; counts
            may overlap.
        offers:
          items:
            $ref: '#/components/schemas/OfferCard'
          type: array
          title: Offers
        plans:
          items:
            $ref: '#/components/schemas/FulfilmentPlan'
          type: array
          title: Plans
          description: Single, split or partial plans from all ranked priced offers,
            before the returned offer slice; no extra upstream calls.
        no_match_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: No Match Reason
          description: Explains empty catalog results, including how many candidates
            each hard constraint removed.
        excluded_count:
          type: integer
          title: Excluded Count
          description: FTS matches removed by hard catalog filters, before shortlist
            truncation.
        retrieval:
          $ref: '#/components/schemas/Retrieval'
          description: Deterministic retrieval mode and terms; older stored lookups
            default to intent with no recorded terms.
        matched_count:
          type: integer
          minimum: 0.0
          title: Matched Count
          description: All search matches passing hard constraints, before catalog-pool
            truncation.
          default: 0
        priced_count:
          type: integer
          minimum: 0.0
          title: Priced Count
          description: Shortlisted products checked for live prices, including cached
            evidence.
          default: 0
        screened_count:
          type: integer
          minimum: 0.0
          title: Screened Count
          description: Candidates actually submitted to Decisions, including failed
            requests or missing answers; zero when screening is skipped.
          default: 0
        live_calls:
          $ref: '#/components/schemas/LiveCalls'
        decision_calls:
          type: integer
          title: Decision Calls
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
      additionalProperties: false
      type: object
      required:
      - lookup_id
      - need
      - offers
      - excluded_count
      - live_calls
      - decision_calls
      title: LookupResult
    MandateRecord:
      properties:
