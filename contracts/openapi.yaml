  /oauth/register:
    post:
      tags:
      - OAuth
      summary: RFC 7591 public or confidential client registration; application_type
        required
      operationId: register_oauth_register_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                client_name:
                  type: string
                  maxLength: 120
                  minLength: 1
                  title: Client Name
                  default: MCP client
                redirect_uris:
                  items:
                    type: string
                  type: array
                  maxItems: 10
                  minItems: 1
                  title: Redirect Uris
                application_type:
                  type: string
                  enum:
                  - web
                  - native
                  title: Application Type
                token_endpoint_auth_method:
                  type: string
                  enum:
                  - none
                  - client_secret_post
                  - client_secret_basic
                  title: Token Endpoint Auth Method
                  default: client_secret_basic
                grant_types:
                  items:
                    type: string
                    enum:
                    - authorization_code
                    - refresh_token
                  type: array
                  title: Grant Types
                response_types:
                  items:
                    type: string
                    const: code
                  type: array
                  title: Response Types
              type: object
              required:
              - redirect_uris
              - application_type
              title: Registration
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredClient'
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
        '401':
