components:
  schemas:
    AgentMandate:
      properties:
        customer_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Customer Ids
          description: Customers this agent may quote and order for.
        max_auto_total_eur:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Max Auto Total Eur
          description: Optional per-order ceiling; the lower of this and the global
            ceiling applies.
        max_auto_daily_total_eur:
          type: number
          minimum: 0.0
          title: Max Auto Daily Total Eur
          description: Rolling 24-hour autonomous EUR ceiling; cancelled and human-approved
            orders are excluded.
        note:
          type: string
          title: Note
          description: Free-text record of who granted the mandate.
          default: ''
      additionalProperties: false
      type: object
      required:
      - customer_ids
      - max_auto_daily_total_eur
      title: AgentMandate
    AgentStats:
      properties:
        actor:
          type: string
          title: Actor
          description: 'Distinct agent audit actor, including the agent: prefix.'
        order_count:
          type: integer
          title: Order Count
          description: Orders created by this agent in the window, regardless of current
            status.
        registered:
          type: boolean
          title: Registered
          description: Whether the agent currently has a mandate in the effective
            policy.
      additionalProperties: false
      type: object
      required:
      - actor
      - order_count
      - registered
      title: AgentStats
    ApprovalItem:
      properties:
        order:
          $ref: '#/components/schemas/Order'
        quote:
          $ref: '#/components/schemas/Quote'
      additionalProperties: false
      type: object
      required:
      - order
      - quote
      title: ApprovalItem
    ApprovalPolicy:
      properties:
        max_auto_total_eur:
          type: number
          minimum: 0.0
          title: Max Auto Total Eur
          description: Net EUR ceiling for automatic confirmation.
        min_fit_probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Fit Probability
          description: Minimum fit probability for automatic confirmation.
        warnings_need_approval:
          items:
            type: string
          type: array
          title: Warnings Need Approval
          description: Known warning codes requiring human review.
        ignored_warnings:
          items:
            type: string
          type: array
          title: Ignored Warnings
          description: Only these warnings may be ignored; all other non-reject warnings
            require approval.
      additionalProperties: false
      type: object
      required:
      - max_auto_total_eur
      - min_fit_probability
      - warnings_need_approval
      title: ApprovalPolicy
    ApprovalRequest:
      properties:
        approver:
          type: string
          minLength: 1
          title: Approver
          description: 'Human approver name (MVP: one role, no authentication).'
        comment:
          type: string
          title: Comment
          default: ''
        evidence_revision:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Evidence Revision
          description: Optional revision displayed to the approver. A stale revision
            prevents approval with 409 EVIDENCE_CHANGED before any upstream call;
            ignored for rejection.
      additionalProperties: false
      type: object
      required:
      - approver
      title: ApprovalRequest
    AuditEntry:
      properties:
        id:
          type: integer
          title: Id
        ts:
          type: string
          format: date-time
          title: Ts
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Order Id
        quote_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote Id
        summary:
          type: string
          title: Summary
        data:
          additionalProperties: true
          type: object
          title: Data
      additionalProperties: false
      type: object
      required:
      - id
      - ts
      - actor
      - action
      - order_id
      - quote_id
      - summary
      - data
      title: AuditEntry
    Availability:
      properties:
        available_amount:
          type: number
          title: Available Amount
          description: Sales units deliverable by the deadline, after local Stock
            reservations.
        logistic_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Logistic Model
        closing_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Closing Time
        available_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Available Date
          description: Earliest unblocked upstream delivery date.
        enough:
          type: boolean
          title: Enough
        coverage:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Coverage
          description: Fraction of requested sales units covered by on-time stock.
      additionalProperties: false
      type: object
      required:
      - available_amount
      - enough
      - coverage
      title: Availability
    AverageLiveCalls:
      properties:
        price:
          type: number
          title: Price
          description: Actual price requests divided by lookups in the window; zero
            without lookups.
        availability:
          type: number
          title: Availability
          description: Actual availability requests divided by lookups in the window;
            zero without lookups.
      additionalProperties: false
      type: object
      required:
      - price
      - availability
      title: AverageLiveCalls
    CancelRequest:
      properties:
        cancelled_by:
          type: string
          minLength: 1
          title: Cancelled By
          description: Non-blank human name responsible for cancellation.
        reason:
          type: string
          title: Reason
          default: ''
      additionalProperties: false
      type: object
      required:
      - cancelled_by
      title: CancelRequest
    ConstraintSource:
      properties:
        code:
          type: string
          title: Code
        source:
          type: string
          enum:
          - request
          - customer_policy
          title: Source
      additionalProperties: false
      type: object
      required:
      - code
      - source
      title: ConstraintSource
    CoveredQuantity:
      properties:
        value:
          type: number
          minimum: 0.0
          title: Value
        unit:
          type: string
          enum:
          - L
          - KG
          - SALES_UNIT
          title: Unit
      additionalProperties: false
      type: object
      required:
      - value
      - unit
      title: CoveredQuantity
    CustomerConstraints:
      properties:
        required_claims:
          items:
            type: string
          type: array
          title: Required Claims
        exclude_allergens:
          items:
            type: string
          type: array
          title: Exclude Allergens
        note:
          type: string
          title: Note
          default: ''
      additionalProperties: false
      type: object
      title: CustomerConstraints
    EffectiveConstraints:
      properties:
        required_claims:
          items:
            $ref: '#/components/schemas/ConstraintSource'
          type: array
          title: Required Claims
        exclude_allergens:
          items:
            $ref: '#/components/schemas/ConstraintSource'
          type: array
          title: Exclude Allergens
      additionalProperties: false
      type: object
      title: EffectiveConstraints
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
          description: Stable domain error code, e.g. EXPIRED_QUOTE.
        message:
          type: string
          title: Message
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: Additional error evidence, including approval rule_hits when
            available.
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ErrorResponse
    FulfilmentPlan:
      properties:
        kind:
          type: string
          enum:
          - single
          - split
          - partial
          title: Kind
        lines:
          items:
            $ref: '#/components/schemas/PlanLine'
          type: array
          maxItems: 4
          minItems: 1
          title: Lines
        total:
          type: number
          minimum: 0.0
          title: Total
          description: Sum of fixed net EUR line totals at lookup time.
        coverage:
          $ref: '#/components/schemas/CoveredQuantity'
          description: Sum of line covers in the need's unit; whole packs may over-cover.
        uncovered:
          $ref: '#/components/schemas/CoveredQuantity'
          description: Requested quantity still missing by the deadline; zero for
            a complete plan.
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
        policy_preview:
          $ref: '#/components/schemas/PolicyResult'
          description: Side-effect-free current policy evaluation for the caller,
            including mandate and daily limits. Stock and policy may change before
            placement; the order result is authoritative.
      additionalProperties: false
      type: object
      required:
      - kind
      - lines
      - total
      - coverage
      - uncovered
      - policy_preview
      title: FulfilmentPlan
    Health:
      properties:
        status:
          type: string
          title: Status
        catalog_rows:
          type: integer
          title: Catalog Rows
        coverage:
          additionalProperties:
            additionalProperties:
              type: integer
            type: object
          type: object
          title: Coverage
          description: 'Catalog build coverage: filled and empty counts per field.'
      additionalProperties: false
      type: object
      required:
      - status
      - catalog_rows
      title: Health
    HumanDecisions:
      properties:
        approved:
          type: integer
          title: Approved
          description: Successful human APPROVE audit events in the window.
        rejected:
          type: integer
          title: Rejected
          description: Successful human REJECT audit events in the window.
      additionalProperties: false
      type: object
      required:
      - approved
      - rejected
      title: HumanDecisions
    LiveCalls:
      properties:
        price:
          type: integer
          title: Price
          description: Actual outbound price HTTP requests, including failed attempts.
          default: 0
        availability:
          type: integer
          title: Availability
          description: Actual outbound availability HTTP requests.
          default: 0
      additionalProperties: false
      type: object
      title: LiveCalls
    LookupResult:
      properties:
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
          description: Creating agent; legacy unowned records are operator-only.
        lookup_id:
          type: string
          title: Lookup Id
          description: Server-side need reference; pass as need_ref when quoting to
            preserve fit and constraints.
        need:
          $ref: '#/components/schemas/NeedSpec'
        effective_constraints:
          $ref: '#/components/schemas/EffectiveConstraints'
        exclusion_counts:
          additionalProperties:
            type: integer
          type: object
          title: Exclusion Counts
          description: Removal counts by constraint source and evidence reason; counts
            may overlap.
        offers:
          items:
            $ref: '#/components/schemas/OfferCard'
          type: array
          title: Offers
        plans:
          items:
            $ref: '#/components/schemas/FulfilmentPlan'
          type: array
          title: Plans
          description: Single, split or partial plans from all ranked priced offers,
            before the returned offer slice; no extra upstream calls.
        no_match_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: No Match Reason
          description: Explains empty catalog results, including how many candidates
            each hard constraint removed.
        excluded_count:
          type: integer
          title: Excluded Count
          description: FTS matches removed by hard catalog filters, before shortlist
            truncation.
        retrieval:
          $ref: '#/components/schemas/Retrieval'
          description: Deterministic retrieval mode and terms; older stored lookups
            default to intent with no recorded terms.
        matched_count:
          type: integer
          minimum: 0.0
          title: Matched Count
          description: All search matches passing hard constraints, before catalog-pool
            truncation.
          default: 0
        priced_count:
          type: integer
          minimum: 0.0
          title: Priced Count
          description: Shortlisted products checked for live prices, including cached
            evidence.
          default: 0
        screened_count:
          type: integer
          minimum: 0.0
          title: Screened Count
          description: Catalog pool size submitted for Decisions screening.
          default: 0
        live_calls:
          $ref: '#/components/schemas/LiveCalls'
        decision_calls:
          type: integer
          title: Decision Calls
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
      additionalProperties: false
      type: object
      required:
      - lookup_id
      - need
      - offers
      - excluded_count
      - live_calls
      - decision_calls
      title: LookupResult
    NeedSpec:
      properties:
        customer_id:
          type: string
          minLength: 1
          title: Customer Id
          description: Required non-blank Valio customer identifier.
        deliver_by:
          type: string
          format: date
          title: Deliver By
          description: Delivery date between today and today + 60 days, Europe/Helsinki.
        intent:
          type: string
          minLength: 1
          title: Intent
          description: Buyer need; the outside agent structures this request.
        search_terms:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Search Terms
          description: Optional FTS terms, combined with AND.
        required_claims:
          items:
            type: string
          type: array
          title: Required Claims
          description: All must exist as catalog nutritionalClaim IDs.
        exclude_allergens:
          items:
            type: string
          type: array
          title: Exclude Allergens
          description: Requires an uncontradicted free-from entry or a declaration
            not listing the excluded allergen; missing data never proves absence.
        quantity:
          $ref: '#/components/schemas/Quantity'
        max_candidates:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Max Candidates
          description: Maximum ranked offers returned; suitable candidates are priced
            up to shortlist.live_max.
          default: 10
        preferences:
          $ref: '#/components/schemas/Preferences'
          description: Soft preferences; differences mark substitutes and require
            approval by default.
      additionalProperties: false
      type: object
      required:
      - customer_id
      - deliver_by
      - intent
      - quantity
      title: NeedSpec
    OfferCard:
      properties:
        product_id:
          type: string
          title: Product Id
        name:
          type: string
          title: Name
        sales_unit:
          type: string
          title: Sales Unit
        size_per_sales_unit:
          anyOf:
          - type: number
          - type: 'null'
          title: Size Per Sales Unit
          description: Quantity unit per sales unit; null when conversion is unknown.
        size_unit:
          type: string
          enum:
          - L
          - KG
          - SALES_UNIT
          title: Size Unit
        size_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Size Source
          description: price_ratio, catalog, name_parse, base_unit or sales_unit.
        size_confirmed_by_price:
          type: boolean
          title: Size Confirmed By Price
          description: True when the live price ratio agrees with the selected exact
            catalog or name size within 3%.
          default: false
        units_needed:
          anyOf:
          - type: number
          - type: 'null'
          title: Units Needed
          description: Whole sales units; KG sales quantities are rounded to the allowed
            lot step.
        unit_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Unit Price
          description: Net catalog price per sales unit, fixed on quote creation.
        unit_price_with_tax:
          anyOf:
          - type: number
          - type: 'null'
          title: Unit Price With Tax
        price_per_l_or_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Price Per L Or Kg
        total:
          anyOf:
          - type: number
          - type: 'null'
          title: Total
          description: Net line total in currency.
        purchase_total:
          anyOf:
          - type: number
          - type: 'null'
          title: Purchase Total
          description: Net cost of all sales units needed to cover the request, including
            overbuy; unit_price is per sales unit.
        overbuy:
          anyOf:
          - $ref: '#/components/schemas/Overbuy'
          - type: 'null'
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
          description: Upstream currency; missing currency is a PRICE_ERROR.
        valid_from:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid From
        valid_to:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid To
        net_price_found:
          type: boolean
          title: Net Price Found
          default: false
        availability:
          $ref: '#/components/schemas/Availability'
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
        delivery_reliability:
          anyOf:
          - type: number
          - type: 'null'
          title: Delivery Reliability
        co2_kg_per_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Co2 Kg Per Kg
        labels:
          items:
            type: string
          type: array
          title: Labels
        matched_because:
          items:
            type: string
          type: array
          title: Matched Because
        fit:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Fit
          description: Decisions predicate probability; never inferred from a name
            alone.
        fit_question:
          anyOf:
          - type: string
          - type: 'null'
          title: Fit Question
        provenance:
          additionalProperties:
            $ref: '#/components/schemas/Provenance'
          type: object
          title: Provenance
        score:
          type: number
          title: Score
          default: 0
        score_breakdown:
          additionalProperties:
            type: number
          type: object
          title: Score Breakdown
          description: Weighted price, coverage, reliability, co2 and fit contributions;
            sums to score.
        rank_label:
          anyOf:
          - type: string
            enum:
            - best
            - better
            - good
          - type: 'null'
          title: Rank Label
      additionalProperties: false
      type: object
      required:
      - product_id
      - name
      - sales_unit
      - size_unit
      - availability
      - provenance
      title: OfferCard
    Order:
      properties:
        id:
          type: string
          title: Id
        quote_id:
          type: string
          title: Quote Id
        agent_id:
          type: string
          title: Agent Id
        idempotency_key:
          type: string
          title: Idempotency Key
        status:
          type: string
          enum:
          - CONFIRMED
          - PENDING_APPROVAL
          - REJECTED
          - EXPIRED
          - CANCELLED
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        total:
          type: number
          title: Total
        currency:
          type: string
          title: Currency
        lines:
          items:
            $ref: '#/components/schemas/OfferCard'
          type: array
          title: Lines
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
          description: Order-level risks retained from the quoted fulfilment plan.
        evidence_revision:
          type: integer
          minimum: 1.0
          title: Evidence Revision
          description: Decision evidence revision; starts at 1 and increases when
            approval refresh changes the facts requiring review.
          default: 1
        policy:
          $ref: '#/components/schemas/PolicyResult'
        live_calls:
          $ref: '#/components/schemas/LiveCalls'
        approver:
          anyOf:
          - type: string
          - type: 'null'
          title: Approver
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        cancelled_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancelled By
          description: Human name or placing agent ID responsible for cancellation.
        cancel_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancel Reason
          description: Reason supplied when the order was cancelled.
      additionalProperties: false
      type: object
      required:
      - id
      - quote_id
      - agent_id
      - idempotency_key
      - status
      - created_at
      - expires_at
      - total
      - currency
      - lines
      - policy
      - live_calls
      title: Order
    OrderRequest:
      properties:
        quote_id:
          type: string
          title: Quote Id
          description: An unexpired OPEN fixed-price quote.
      additionalProperties: false
      type: object
      required:
      - quote_id
      title: OrderRequest
    OrderTimeline:
      properties:
        order_id:
          type: string
          title: Order Id
          description: Order whose complete history is returned.
        quote_id:
          type: string
          title: Quote Id
          description: Fixed-price quote accepted by the order.
        lookup_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Lookup Id
          description: Quote need_ref linking the original lookup; null for explicit
            selection without a lookup.
        agent_id:
          type: string
          title: Agent Id
          description: Agent that placed the order.
        status:
          type: string
          enum:
          - CONFIRMED
          - PENDING_APPROVAL
          - REJECTED
          - EXPIRED
          - CANCELLED
          title: Status
          description: Current local order status after refreshing expirations.
        steps:
          items:
            $ref: '#/components/schemas/TimelineStep'
          type: array
          title: Steps
          description: Related lookup, quote and order audit events, oldest first;
            each event appears once.
        total_live_calls:
          $ref: '#/components/schemas/LiveCalls'
          description: Sum of actual Valio requests across all steps, including failed
            checks and human approval.
        total_decision_calls:
          type: integer
          title: Total Decision Calls
          description: Sum of actual Decisions requests across all steps.
      additionalProperties: false
      type: object
      required:
      - order_id
      - quote_id
      - lookup_id
      - agent_id
      - status
      - steps
      - total_live_calls
      - total_decision_calls
      title: OrderTimeline
    Overbuy:
      properties:
        amount:
          type: number
          minimum: 0.0
          title: Amount
        unit:
          type: string
          enum:
          - L
          - KG
          - SALES_UNIT
          title: Unit
      additionalProperties: false
      type: object
      required:
      - amount
      - unit
      title: Overbuy
    PackSizePreference:
      properties:
        min:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Min
        max:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Max
      additionalProperties: false
      type: object
      title: PackSizePreference
    PlanLine:
      properties:
        product_id:
          type: string
          title: Product Id
        units:
          type: number
          exclusiveMinimum: 0.0
          title: Units
          description: 'Sales quantity: allowed_lot_size multiples for KG-sold products,
            whole units otherwise; never exceeds on-time stock.'
        covers:
          $ref: '#/components/schemas/CoveredQuantity'
      additionalProperties: false
      type: object
      required:
      - product_id
      - units
      - covers
      title: PlanLine
    PlanRef:
      properties:
        lookup_id:
          type: string
          minLength: 1
          title: Lookup Id
        plan_index:
          type: integer
          minimum: 0.0
          title: Plan Index
          description: Zero-based index in the stored lookup's plans.
      additionalProperties: false
      type: object
      required:
      - lookup_id
      - plan_index
      title: PlanRef
    PolicyResetRequest:
      properties:
        updated_by:
          type: string
          minLength: 1
          title: Updated By
          description: Name of the human changing the policy.
      additionalProperties: false
      type: object
      required:
      - updated_by
      title: PolicyResetRequest
    PolicyResource:
      properties:
        approval:
          $ref: '#/components/schemas/ApprovalPolicy'
        reject:
          $ref: '#/components/schemas/RejectPolicy'
        ranking_weights:
          $ref: '#/components/schemas/RankingWeights'
        shortlist:
          $ref: '#/components/schemas/ShortlistPolicy'
        agents:
          additionalProperties:
            $ref: '#/components/schemas/AgentMandate'
          type: object
          title: Agents
          description: Agent identity to mandate; ordering requires a mandate. Lookups
            and quotes are open to unregistered agents.
        customers:
          additionalProperties:
            $ref: '#/components/schemas/CustomerConstraints'
          type: object
          title: Customers
          description: Standing buyer constraints unioned with each request at every
            step.
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: Last runtime update in UTC; null for committed defaults.
        updated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated By
          description: Human responsible for the last runtime update.
        known_warning_codes:
          items:
            type: string
          type: array
          title: Known Warning Codes
          description: All warning codes the lookup engine can emit; server supplied.
      additionalProperties: false
      type: object
      required:
      - approval
      - reject
      - ranking_weights
      title: PolicyResource
    PolicyResult:
      properties:
        outcome:
          type: string
          enum:
          - CONFIRMED
          - PENDING_APPROVAL
          - REJECTED
          title: Outcome
        hits:
          items:
            $ref: '#/components/schemas/RuleHit'
          type: array
          title: Hits
      additionalProperties: false
      type: object
      required:
      - outcome
      - hits
      title: PolicyResult
    PolicyUpdateRequest:
      properties:
        updated_by:
          type: string
          minLength: 1
          title: Updated By
          description: Name of the human changing the policy.
        policy:
          $ref: '#/components/schemas/PolicyResource'
          description: Editable policy sections. Response metadata may be echoed;
            the server replaces it.
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
          description: Optional reason for the policy change.
      additionalProperties: false
      type: object
      required:
      - updated_by
      - policy
      title: PolicyUpdateRequest
    Preferences:
      properties:
        brands:
          items:
            type: string
          type: array
          title: Brands
        max_price_per_unit:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Max Price Per Unit
          description: Maximum net EUR per L or KG.
        pack_size:
          anyOf:
          - $ref: '#/components/schemas/PackSizePreference'
          - type: 'null'
          description: L or KG per sales unit.
        labels:
          items:
            type: string
          type: array
          title: Labels
          description: Preferred catalog packaging label IDs.
      additionalProperties: false
      type: object
      title: Preferences
    Product:
      properties:
        id:
          type: string
          title: Id
        name_en:
          type: string
          title: Name En
        name_fi:
          type: string
          title: Name Fi
          default: ''
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        sales_unit:
          type: string
          title: Sales Unit
        base_unit:
          type: string
          title: Base Unit
        allowed_lot_size:
          type: number
          title: Allowed Lot Size
          default: 1
        vendor_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor Name
        brand:
          anyOf:
          - type: string
          - type: 'null'
          title: Brand
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
        temperature_condition:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Temperature Condition
        units:
          additionalProperties:
            type: number
          type: object
          title: Units
          description: unitId to sizeInBaseUnits.
        claims:
          items:
            type: string
          type: array
          title: Claims
        allergens_contains:
          items:
            type: string
          type: array
          title: Allergens Contains
        allergen_status:
          additionalProperties:
            items:
              type: string
              enum:
              - contains
              - may_contain
              - undeclared
              - free_from
            type: array
          type: object
          title: Allergen Status
        has_allergen_declaration:
          type: boolean
          title: Has Allergen Declaration
          default: false
        free_from:
          items:
            type: string
          type: array
          title: Free From
        labels:
          items:
            type: string
          type: array
          title: Labels
        base_volume_l:
          anyOf:
          - type: number
          - type: 'null'
          title: Base Volume L
        base_net_weight_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Base Net Weight Kg
        size_suspect:
          type: boolean
          title: Size Suspect
          default: false
        sales_volume_l:
          anyOf:
          - type: number
          - type: 'null'
          title: Sales Volume L
          description: Content of the CASE record when sold as a case.
        sales_net_weight_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Sales Net Weight Kg
        variable_unit:
          type: boolean
          title: Variable Unit
          default: false
        deposits:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Deposits
        delivery_reliability:
          anyOf:
          - type: number
          - type: 'null'
          title: Delivery Reliability
        co2_kg_per_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Co2 Kg Per Kg
          description: Product-group average, not an individual product measurement.
      additionalProperties: false
      type: object
      required:
      - id
      - name_en
      - sales_unit
      - base_unit
      title: Product
    Provenance:
      properties:
        source:
          type: string
          title: Source
          description: Upstream endpoint or catalog source.
        fetched_at:
          type: string
          format: date-time
          title: Fetched At
          description: Upstream timeNow when supplied; otherwise local UTC receipt
            time.
        valid_to:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid To
      additionalProperties: false
      type: object
      required:
      - source
      - fetched_at
      title: Provenance
    Quantity:
      properties:
        value:
          type: number
          maximum: 1000000.0
          exclusiveMinimum: 0.0
          title: Value
          description: Requested positive quantity, at most 1,000,000.
        unit:
          type: string
          enum:
          - L
          - KG
          - SALES_UNIT
          title: Unit
          description: Litres, kilograms or product sales units.
      additionalProperties: false
      type: object
      required:
      - value
      - unit
      title: Quantity
    Quote:
      properties:
        id:
          type: string
          title: Id
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
          description: Creating agent; legacy unowned records are operator-only.
        customer_id:
          type: string
          title: Customer Id
        deliver_by:
          type: string
          format: date
          title: Deliver By
        need_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Need Ref
        plan_ref:
          anyOf:
          - $ref: '#/components/schemas/PlanRef'
          - type: 'null'
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
          description: Plan-level risks, including an uncovered part of the original
            need; retained through ordering.
        status:
          type: string
          enum:
          - OPEN
          - ACCEPTED
          - EXPIRED
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: Earliest price validity, future cutoff or 30 minutes after
            creation.
        lines:
          items:
            $ref: '#/components/schemas/OfferCard'
          type: array
          title: Lines
          description: Fixed-price lines; units_needed is the quoted sales quantity.
        total:
          type: number
          title: Total
        currency:
          type: string
          title: Currency
        hard_constraint_violations:
          items:
            type: string
          type: array
          title: Hard Constraint Violations
        live_calls:
          $ref: '#/components/schemas/LiveCalls'
      additionalProperties: false
      type: object
      required:
      - id
      - customer_id
      - deliver_by
      - status
      - created_at
      - expires_at
      - lines
      - total
      - currency
      - live_calls
      title: Quote
    QuoteLineRequest:
      properties:
        product_id:
          type: string
          minLength: 1
          title: Product Id
        quantity_sales_units:
          type: number
          maximum: 1000000.0
          exclusiveMinimum: 0.0
          title: Quantity Sales Units
          description: Explicit sales quantity, at most 1,000,000; KG follows allowedLotSize,
            others are whole sales units.
      additionalProperties: false
      type: object
      required:
      - product_id
      - quantity_sales_units
      title: QuoteLineRequest
    QuoteRequest:
      properties:
        customer_id:
          type: string
          minLength: 1
          title: Customer Id
          description: Required non-blank Valio customer identifier.
        deliver_by:
          type: string
          format: date
          title: Deliver By
          description: Delivery date between today and today + 60 days, Europe/Helsinki.
        lines:
          anyOf:
          - items:
              $ref: '#/components/schemas/QuoteLineRequest'
            type: array
            maxItems: 10
            minItems: 1
          - type: 'null'
          title: Lines
        plan_ref:
          anyOf:
          - $ref: '#/components/schemas/PlanRef'
          - type: 'null'
          description: Alternative to explicit lines; recheck a stored plan live.
            Exactly one of lines or plan_ref is required.
        need_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Need Ref
          description: 'Required with explicit lines: stored lookup_id binding fit,
            preferences and current customer constraints. Otherwise 422 NEED_REF_REQUIRED.'
      additionalProperties: false
      type: object
      required:
      - customer_id
      - deliver_by
      title: QuoteRequest
    RankingWeights:
      properties:
        price:
          type: number
          minimum: 0.0
          title: Price
        coverage:
          type: number
          minimum: 0.0
          title: Coverage
        reliability:
          type: number
          minimum: 0.0
          title: Reliability
        co2:
          type: number
          minimum: 0.0
          title: Co2
        fit:
          type: number
          minimum: 0.0
          title: Fit
      additionalProperties: false
      type: object
      required:
      - price
      - coverage
      - reliability
      - co2
      - fit
      title: RankingWeights
    RejectPolicy:
      properties:
        on_hard_constraint_violation:
          type: boolean
          title: On Hard Constraint Violation
          description: Reject when catalog hard constraints fail.
        'on':
          items:
            type: string
          type: array
          title: 'On'
          description: Known warning codes causing rejection.
      additionalProperties: false
      type: object
      required:
      - on_hard_constraint_violation
      - 'on'
      title: RejectPolicy
    Retrieval:
      properties:
        mode:
          type: string
          enum:
          - terms
          - intent
          - intent_broadened
          title: Mode
          default: intent
        terms_used:
          items:
            type: string
          type: array
          title: Terms Used
          description: Search words or phrases actually tried; broadened terms are
            lower-case and omit numbers, units and stop words.
      additionalProperties: false
      type: object
      title: Retrieval
    RuleCount:
      properties:
        rule:
          type: string
          title: Rule
          description: Placement policy rule identifier.
        count:
          type: integer
          title: Count
          description: Rule-hit occurrences in PLACE_ORDER audit events.
      additionalProperties: false
      type: object
      required:
      - rule
      - count
      title: RuleCount
    RuleHit:
      properties:
        rule:
          type: string
          title: Rule
        detail:
          type: string
          title: Detail
      additionalProperties: false
      type: object
      required:
      - rule
      - detail
      title: RuleHit
    ShortlistPolicy:
      properties:
        catalog_pool:
          type: integer
          maximum: 100.0
          minimum: 10.0
          title: Catalog Pool
          description: Catalog candidates screened before live Valio calls.
        live_max:
          type: integer
          maximum: 40.0
          minimum: 10.0
          title: Live Max
          description: Maximum suitable candidates priced before returning the top
            offers.
          default: 25
      additionalProperties: false
      type: object
      required:
      - catalog_pool
      title: ShortlistPolicy
    Stats:
      properties:
        since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
          description: Inclusive UTC lower bound; naive input is interpreted as UTC.
            Null means all history.
        lookups:
          type: integer
          title: Lookups
          description: LOOKUP audit events in the window.
        orders_by_status:
          additionalProperties:
            type: integer
          type: object
          title: Orders By Status
          description: Current statuses of orders created in the window, including
            zero counts.
        placement_outcomes:
          additionalProperties:
            type: integer
          type: object
          title: Placement Outcomes
          description: Original CONFIRMED/PENDING_APPROVAL/REJECTED outcomes from
            PLACE_ORDER events in the window; retries excluded.
        human_decisions:
          $ref: '#/components/schemas/HumanDecisions'
          description: Successful human decisions by event time, even for older orders.
        confirmed_spend_total_eur:
          type: number
          title: Confirmed Spend Total Eur
          description: Net EUR total of currently CONFIRMED orders created in the
            window.
        average_live_calls_per_lookup:
          $ref: '#/components/schemas/AverageLiveCalls'
          description: Lookup-only outbound Valio request averages; quote and order
            checks excluded.
        total_decisions_calls:
          type: integer
          title: Total Decisions Calls
          description: Actual Decisions HTTP requests recorded in audit events in
            the window.
        top_warning_codes:
          items:
            $ref: '#/components/schemas/WarningCount'
          type: array
          title: Top Warning Codes
          description: Top five offer warning codes in lookups in the window; count
            descending, code ascending on ties.
        top_rule_hits:
          items:
            $ref: '#/components/schemas/RuleCount'
          type: array
          title: Top Rule Hits
          description: Top five placement rule hits; count descending, rule ascending
            on ties.
        agents_seen:
          items:
            $ref: '#/components/schemas/AgentStats'
          type: array
          title: Agents Seen
          description: Agent actors seen in audit events in the window, sorted by
            actor, with order counts.
      additionalProperties: false
      type: object
      required:
      - since
      - lookups
      - orders_by_status
      - placement_outcomes
      - human_decisions
      - confirmed_spend_total_eur
      - average_live_calls_per_lookup
      - total_decisions_calls
      - top_warning_codes
      - top_rule_hits
      - agents_seen
      title: Stats
    TimelineStep:
      properties:
        ts:
          type: string
          format: date-time
          title: Ts
          description: UTC audit event time; steps are oldest first, with audit ID
            breaking ties.
        actor:
          type: string
          title: Actor
          description: Recorded actor, such as agent:buyer, human:Ada or system.
        action:
          type: string
          title: Action
          description: Original audit action, including EVIDENCE_CHANGED, replays
            and failed attempts.
        step:
          type: string
          enum:
          - lookup
          - quote
          - order
          - decision
          - cancellation
          - system
          title: Step
          description: Human-facing stage of the order lifecycle.
        summary:
          type: string
          title: Summary
          description: Original human-readable audit summary.
        data:
          additionalProperties: true
          type: object
          title: Data
          description: Unmodified audit payload, including inputs, evidence and policy
            rule hits.
        live_calls:
          $ref: '#/components/schemas/LiveCalls'
          description: Actual Valio requests for this event; absent audit counts default
            to zero.
        decision_calls:
          type: integer
          title: Decision Calls
          description: Actual Decisions requests for this event; absent audit counts
            default to zero.
          default: 0
      additionalProperties: false
      type: object
      required:
      - ts
      - actor
      - action
      - step
      - summary
      - data
      title: TimelineStep
    Warning:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine-readable warning code.
        text:
          type: string
          title: Text
          description: Human-readable explanation.
      additionalProperties: false
      type: object
      required:
      - code
      - text
      title: Warning
    WarningCount:
      properties:
        code:
          type: string
          title: Code
          description: Warning code found on a stored lookup offer.
        count:
          type: integer
          title: Count
          description: Occurrences across offers, excluding lookup-level duplicates.
      additionalProperties: false
      type: object
      required:
      - code
      - count
      title: WarningCount
  securitySchemes:
    BearerAuth:
      type: http
      description: Operator-issued agent key or operator token.
      scheme: bearer
