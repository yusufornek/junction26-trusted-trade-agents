  /v1/agents/{agent_id}/autonomy:
    post:
      summary: Change Autonomy
      description: Operator or this agent's buyer_admin grants or removes autonomy.
        Requires a reason; audits AUTONOMY_CHANGED with a track-record snapshot. Optional
        Idempotency-Key binds this target and payload, rechecks current target scope,
        and replays the first result without changing authority again; changed target
        or payload returns 409 IDEMPOTENCY_CONFLICT. Runtime policy publication follows
        the enclosing command commit. Readiness never grants authority automatically.
        A stricter signed buyer mandate still wins.
      operationId: change_autonomy_v1_agents__agent_id__autonomy_post
      security:
      - BearerAuth: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
