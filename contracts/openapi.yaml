  /v1/approvals/{order_id}/approve:
    post:
      summary: Approve
      description: Approve only the reviewed evidence. Optionally send evidence_revision;
        a stale revision returns 409 EVIDENCE_CHANGED without upstream calls. Refresh
        stock and policy; changed decision evidence stays pending at a new revision
        and returns 409 EVIDENCE_CHANGED with data {evidence_revision, changes}. Review
        the refreshed order before approving again. Unchanged evidence confirms. A
        revoked buyer VC returns 403 MANDATE_INVALID (revoked); a removed policy mandate
        returns 403 AGENT_NOT_REGISTERED with rule hits in data; the order remains
        pending and can be rejected. Cached approval responses recheck the reviewer's
        current organisation and customer scope.
      operationId: approve_v1_approvals__order_id__approve_post
      security:
      - BearerAuth: []
      parameters:
      - name: order_id
