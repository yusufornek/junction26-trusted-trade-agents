                      `static.modelcontextprotocol.io/schemas/` (i.e.,

                      `https://static.modelcontextprotocol.io/schemas/v1/server-card.schema.json`).

                      Schema URLs are versioned by the `vN` segment rather than by
                      date; a

                      breaking revision of the Server Card shape publishes a new `vN`
                      family.'
                  _meta:
                    additionalProperties: {}
                    type: object
                    description: 'Extension metadata using reverse-DNS namespacing
                      for vendor-specific data.


                      Follows the protocol''s standard `_meta` definition.'
                  description:
                    type: string
                    maxLength: 100
                    minLength: 1
                    description: 'Clear human-readable explanation of server functionality.
                      Should focus on

                      capabilities, not implementation details.'
                  icons:
                    items:
                      properties:
                        mimeType:
                          type: string
                          description: 'Optional MIME type override if the source
                            MIME type is missing or generic.

                            For example: `"image/png"`, `"image/jpeg"`, or `"image/svg+xml"`.'
                        sizes:
                          items:
                            type: string
                          type: array
                          description: 'Optional array of strings that specify sizes
                            at which the icon can be used.

                            Each string should be in WxH format (e.g., `"48x48"`,
                            `"96x96"`) or `"any"` for scalable formats like SVG.


                            If not provided, the client should assume that the icon
                            can be used at any size.'
                        src:
                          type: string
                          format: uri
                          description: 'A standard URI pointing to an icon resource.
                            May be an HTTP/HTTPS URL or a

                            `data:` URI with Base64-encoded image data.


                            Consumers SHOULD take steps to ensure URLs serving icons
                            are from the

                            same domain as the client/server or a trusted domain.


                            Consumers SHOULD take appropriate precautions when consuming
                            SVGs as they can contain

                            executable JavaScript.'
                        theme:
                          type: string
                          enum:
                          - dark
                          - light
                          description: 'Optional specifier for the theme this icon
                            is designed for. `"light"` indicates

                            the icon is designed to be used with a light background,
                            and `"dark"` indicates

                            the icon is designed to be used with a dark background.


                            If not provided, the client should assume the icon can
                            be used with any theme.'
