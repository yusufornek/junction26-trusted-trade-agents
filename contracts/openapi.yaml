  /mcp/server-card:
    get:
      summary: Draft MCP connection card; tools are listed at runtime
      operationId: card_mcp_server_card_get
      responses:
        '200':
          description: Successful Response
          content:
            application/mcp-server-card+json:
              schema:
                properties:
                  $schema:
                    type: string
                    pattern: ^https://static\.modelcontextprotocol\.io/schemas/v1/server-card\.schema\.json$
                    format: uri
                    description: 'The Server Card JSON Schema URI that this document
                      conforms to. Required.


