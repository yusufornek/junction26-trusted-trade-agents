components:
  schemas:
    AgentContext:
      properties:
        principal:
          additionalProperties: true
          type: object
          title: Principal
        customer_ids:
          items:
            type: string
          type: array
          title: Customer Ids
        mandate:
          additionalProperties: true
          type: object
          title: Mandate
        effective_limits:
          additionalProperties: true
          type: object
          title: Effective Limits
        remaining_budget:
          additionalProperties: true
          type: object
          title: Remaining Budget
        environment:
          type: string
          title: Environment
        rate_limits:
          additionalProperties: true
          type: object
          title: Rate Limits
        supported_operations:
          items:
            type: string
          type: array
          title: Supported Operations
        standing_constraints:
          additionalProperties: true
          type: object
          title: Standing Constraints
      additionalProperties: false
      type: object
      required:
      - principal
      - customer_ids
      - mandate
      - effective_limits
      - remaining_budget
      - environment
      - rate_limits
      - supported_operations
      - standing_constraints
      title: AgentContext
    AgentMandate:
      properties:
        autonomy:
          anyOf:
          - type: string
            enum:
            - approval_required
            - autonomous_within_limits
          - type: 'null'
          title: Autonomy
          description: Omission uses policy.autonomy.default; new agents require sign-off
            by default.
        rate_limits:
          anyOf:
          - $ref: '#/components/schemas/RateLimits'
          - type: 'null'
        customer_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Customer Ids
          description: Customers this agent may quote and order for.
        max_auto_total_eur:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Max Auto Total Eur
          description: Optional per-order ceiling; the lower of this and the global
            ceiling applies.
        max_auto_daily_total_eur:
          type: number
          minimum: 0.0
          title: Max Auto Daily Total Eur
          description: Rolling 24-hour autonomous EUR ceiling; cancelled and human-approved
            orders are excluded.
        note:
          type: string
          title: Note
          description: Free-text record of who granted the mandate.
          default: ''
      additionalProperties: false
      type: object
      required:
      - customer_ids
      - max_auto_daily_total_eur
      title: AgentMandate
    AgentStats:
      properties:
        actor:
          type: string
          title: Actor
          description: 'Distinct agent audit actor, including the agent: prefix.'
        order_count:
          type: integer
          title: Order Count
          description: Orders created by this agent in the window, regardless of current
            status.
        registered:
          type: boolean
          title: Registered
          description: Whether the agent currently has a policy mandate or a valid,
            trusted, unrevoked buyer credential.
        mandate_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Mandate Id
          description: Currently valid buyer mandate in use; historical IDs remain
            on objects and audit entries.
      additionalProperties: false
      type: object
      required:
      - actor
      - order_count
      - registered
      title: AgentStats
    AgentTrackRecord:
      properties:
        agent_id:
          type: string
          title: Agent Id
        window_days:
          type: integer
          title: Window Days
        window_start:
          type: string
          format: date-time
          title: Window Start
        window_end:
          type: string
          format: date-time
          title: Window End
        orders_placed:
          type: integer
          title: Orders Placed
        approved_unchanged:
          type: integer
          title: Approved Unchanged
        rejected:
          type: integer
          title: Rejected
        expired:
          type: integer
          title: Expired
        evidence_changes:
          type: integer
          title: Evidence Changes
        cancellations:
          type: integer
          title: Cancellations
        hard_constraint_refusals:
          type: integer
          title: Hard Constraint Refusals
        average_approval_time_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Approval Time Seconds
        approved_unchanged_share:
          type: number
          title: Approved Unchanged Share
        rejection_share:
          type: number
          title: Rejection Share
        last_rejection_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Rejection At
        last_hard_constraint_refusal_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Hard Constraint Refusal At
        autonomy_recommendation:
          $ref: '#/components/schemas/AutonomyRecommendation'
      additionalProperties: false
      type: object
      required:
      - agent_id
      - window_days
      - window_start
      - window_end
      - orders_placed
      - approved_unchanged
      - rejected
      - expired
      - evidence_changes
      - cancellations
      - hard_constraint_refusals
      - average_approval_time_seconds
      - approved_unchanged_share
      - rejection_share
      - last_rejection_at
      - last_hard_constraint_refusal_at
      - autonomy_recommendation
      title: AgentTrackRecord
    ApprovalItem:
      properties:
        order:
          $ref: '#/components/schemas/Order'
        quote:
          $ref: '#/components/schemas/Quote'
      additionalProperties: false
      type: object
      required:
      - order
      - quote
      title: ApprovalItem
    ApprovalPolicy:
      properties:
        max_auto_daily_total_eur:
          type: number
          minimum: 0.0
          title: Max Auto Daily Total Eur
          description: Default rolling 24-hour autonomous EUR ceiling for newly connected
            agents.
          default: 5000
        max_auto_total_eur:
          type: number
          minimum: 0.0
          title: Max Auto Total Eur
          description: Net EUR ceiling for automatic confirmation.
        min_fit_probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Fit Probability
          description: Minimum fit probability for automatic confirmation.
        warnings_need_approval:
          items:
            type: string
          type: array
          title: Warnings Need Approval
          description: Known warning codes requiring human review.
        ignored_warnings:
          items:
            type: string
          type: array
          title: Ignored Warnings
          description: Only these warnings may be ignored; all other non-reject warnings
            require approval.
      additionalProperties: false
      type: object
      required:
      - max_auto_total_eur
      - min_fit_probability
      - warnings_need_approval
      title: ApprovalPolicy
    ApprovalRequest:
      properties:
        approver:
          type: string
          minLength: 1
          title: Approver
          description: 'Human approver name (MVP: one role, no authentication).'
        comment:
          type: string
          title: Comment
          default: ''
        evidence_revision:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Evidence Revision
          description: Optional revision displayed to the approver. A stale revision
            prevents approval with 409 EVIDENCE_CHANGED before any upstream call;
            ignored for rejection.
      additionalProperties: false
      type: object
      required:
      - approver
      title: ApprovalRequest
    AuditAnchor:
      properties:
        entries:
          type: integer
          title: Entries
        head_hash:
          type: string
          title: Head Hash
        chain_id:
          type: integer
          title: Chain Id
        tx_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Tx Hash
        block_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Block Number
        status:
          type: string
          enum:
          - sent
          - confirmed
          - failed
          title: Status
        explorer_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Explorer Url
        at:
          type: string
          format: date-time
          title: At
      additionalProperties: false
      type: object
      required:
      - entries
      - head_hash
      - chain_id
      - status
      - at
      title: AuditAnchor
    AuditEntry:
      properties:
        id:
          type: integer
          title: Id
        prev_hash:
          type: string
          title: Prev Hash
          default: ''
        hash:
          type: string
          title: Hash
          default: ''
        ts:
          type: string
          title: Ts
          description: Exact stored timestamp string used in the audit hash; preserve
            its UTC offset spelling for independent verification.
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Order Id
        quote_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote Id
        summary:
          type: string
          title: Summary
        data:
          additionalProperties: true
          type: object
          title: Data
      additionalProperties: false
      type: object
      required:
      - id
      - ts
      - actor
      - action
      - order_id
      - quote_id
      - summary
      - data
      title: AuditEntry
    AuditHead:
      properties:
        entries:
          type: integer
          title: Entries
        head_hash:
          type: string
          title: Head Hash
        at:
          type: string
          title: At
        jws:
          type: string
          title: Jws
          description: Detached Ed25519 JWS over canonical {entries, head_hash, at};
            keep outside the gateway as a checkpoint.
      additionalProperties: false
      type: object
      required:
      - entries
      - head_hash
      - at
      - jws
      title: AuditHead
    AuditVerification:
      properties:
        valid:
          type: boolean
