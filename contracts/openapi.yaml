components:
  schemas:
    AgentStats:
      properties:
        actor:
          type: string
          title: Actor
          description: 'Distinct agent audit actor, including the agent: prefix.'
        order_count:
          type: integer
          title: Order Count
          description: Orders created by this agent in the window, regardless of current
            status.
      additionalProperties: false
      type: object
      required:
      - actor
      - order_count
      title: AgentStats
    ApprovalItem:
      properties:
        order:
          $ref: '#/components/schemas/Order'
        quote:
          $ref: '#/components/schemas/Quote'
      additionalProperties: false
      type: object
      required:
      - order
      - quote
      title: ApprovalItem
    ApprovalPolicy:
      properties:
        max_auto_total_eur:
          type: number
          minimum: 0.0
          title: Max Auto Total Eur
          description: Net EUR ceiling for automatic confirmation.
        min_fit_probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Fit Probability
          description: Minimum fit probability for automatic confirmation.
        warnings_need_approval:
          items:
            type: string
          type: array
          title: Warnings Need Approval
          description: Known warning codes requiring human review.
      additionalProperties: false
      type: object
      required:
      - max_auto_total_eur
      - min_fit_probability
      - warnings_need_approval
      title: ApprovalPolicy
    ApprovalRequest:
      properties:
        approver:
          type: string
          minLength: 1
          title: Approver
          description: 'Human approver name (MVP: one role, no authentication).'
        comment:
          type: string
          title: Comment
          default: ''
      additionalProperties: false
      type: object
      required:
      - approver
      title: ApprovalRequest
    AuditEntry:
      properties:
        id:
          type: integer
          title: Id
        ts:
          type: string
          format: date-time
          title: Ts
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Order Id
        quote_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote Id
        summary:
          type: string
          title: Summary
        data:
          additionalProperties: true
          type: object
          title: Data
      additionalProperties: false
      type: object
      required:
      - id
      - ts
      - actor
      - action
      - order_id
      - quote_id
