          type: number
          title: Total
        currency:
          type: string
          title: Currency
        lines:
          items:
            $ref: '#/components/schemas/OfferCard'
          type: array
          title: Lines
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          title: Warnings
          description: Order-level risks retained from the quoted fulfilment plan.
        evidence_revision:
          type: integer
          minimum: 1.0
          title: Evidence Revision
          description: Decision evidence revision; starts at 1 and increases when
            approval refresh changes the facts requiring review.
          default: 1
        policy:
          $ref: '#/components/schemas/PolicyResult'
        live_calls:
          $ref: '#/components/schemas/LiveCalls'
        approver:
          anyOf:
          - type: string
          - type: 'null'
          title: Approver
        approval_side:
          anyOf:
          - type: string
            enum:
            - buyer
            - valio_operator
          - type: 'null'
          title: Approval Side
          description: Organisation side that signed the human decision; null before
            review or on legacy orders.
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        cancelled_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancelled By
          description: Human name or placing agent ID responsible for cancellation.
        cancel_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancel Reason
          description: Reason supplied when the order was cancelled.
        next_action:
          anyOf:
          - type: string
            enum:
            - WAIT_FOR_APPROVAL
            - STOP
          - type: 'null'
          title: Next Action
          readOnly: true
        poll_after_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Poll After Seconds
          readOnly: true
      additionalProperties: false
      type: object
      required:
