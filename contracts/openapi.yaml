      - connections
      summary: 'Issue a connection key once; idempotent replays return key: null'
      operationId: create_connection_v1_connections_post
      security:
      - BearerAuth: []
      parameters:
      - name: idempotency-key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewConnection'
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Accepted or generated request correlation identifier.
        '401':
          content:
            application/problem+json:
              schema:
