                              default:
                                type: string
                                description: Default value for the input. SHOULD be
                                  a valid value for the input.
                              description:
                                type: string
                                description: 'Human-readable explanation of the input.
                                  Clients can use this to provide

                                  context to the user.'
                              format:
                                type: string
