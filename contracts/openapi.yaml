      type: object
      required:
      - id
      - issuer
      - limits
      - valid_until
      title: MandateRecord
    NeedSpec:
      properties:
        customer_id:
          type: string
          minLength: 1
          title: Customer Id
          description: Required non-blank Valio customer identifier.
        deliver_by:
          type: string
          format: date
          title: Deliver By
          description: Delivery date between today and today + 60 days, Europe/Helsinki.
        intent:
          type: string
          minLength: 1
          title: Intent
          description: Buyer need; the outside agent structures this request.
        search_terms:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Search Terms
          description: Optional FTS terms, combined with AND.
        required_claims:
          items:
            type: string
          type: array
          title: Required Claims
          description: All must exist as catalog nutritionalClaim IDs.
        exclude_allergens:
          items:
            type: string
          type: array
          title: Exclude Allergens
          description: Requires an uncontradicted free-from entry or a declaration
            not listing the excluded allergen; missing data never proves absence.
        quantity:
          $ref: '#/components/schemas/Quantity'
        max_candidates:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Max Candidates
          description: Strict integer maximum ranked offers returned; suitable candidates
            are priced up to shortlist.live_max.
          default: 10
        preferences:
          $ref: '#/components/schemas/Preferences'
          description: Soft preferences; differences mark substitutes and require
            approval by default.
