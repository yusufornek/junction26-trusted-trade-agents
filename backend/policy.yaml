# Fixed net EUR prices. Warnings require a human to acknowledge delivery risks.
autonomy:
  default: approval_required
  promotion:
    min_approved_unchanged: 5
    max_rejection_share: 0.1
    days_since_last_rejection_or_refusal: 7
approval:
  max_auto_total_eur: 1500
  min_fit_probability: 0.80
  warnings_need_approval:
    - PARTIAL_STOCK
    - DATE_SHIFT
    - CUTOFF_PASSED
    - SIZE_UNKNOWN
    - SIZE_MISMATCH
    - NO_FIT_SCORE
    - PRICE_ERROR
    - AVAILABILITY_ERROR
    - OUTSIDE_PREFERENCE
    - SIZE_UNCONFIRMED
    - UNIT_MISMATCH
    - STOCK_MODEL_UNKNOWN
    - CUTOFF_UNKNOWN
  ignored_warnings: [VARIABLE_WEIGHT, DEPOSIT, RETRIEVAL_BROADENED, POOL_TRUNCATED, AVAILABILITY_UNCONFIRMED]
reject:
  on_hard_constraint_violation: true
  on: [SALES_BLOCK, UNKNOWN_PRODUCT, NOT_AVAILABLE, NO_STOCK]
customers: {}
