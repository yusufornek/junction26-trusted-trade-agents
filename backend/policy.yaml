# Fixed net EUR prices. Warnings require a human to acknowledge delivery risks.
approval:
  max_auto_total_eur: 1500
  min_fit_probability: 0.80
  warnings_need_approval:
    - PARTIAL_STOCK
    - DATE_SHIFT
    - CUTOFF_PASSED
    - SIZE_UNKNOWN
    - SIZE_MISMATCH
    - NO_FIT_SCORE
    - PRICE_ERROR
    - AVAILABILITY_ERROR
    - OUTSIDE_PREFERENCE
reject:
  on_hard_constraint_violation: true
  on: [SALES_BLOCK, UNKNOWN_PRODUCT]
# Fit gates live pricing; rank all suitable candidates before returning max_candidates offers.
shortlist: {catalog_pool: 40, live_max: 25}
ranking_weights: {price: 0.4, coverage: 0.25, reliability: 0.15, co2: 0.1, fit: 0.1}
agents:
  hotel-chain-agent:
    customer_ids: ["1"]
    max_auto_daily_total_eur: 5000
    note: "Demo hotel-chain procurement mandate."
  web-console:
    customer_ids: ["1"]
    max_auto_daily_total_eur: 5000
    note: "Operator console buyer-flow mandate."
