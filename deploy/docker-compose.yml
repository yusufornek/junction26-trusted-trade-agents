name: trusted-trade

services:
  backend:
    image: trusted-trade-backend:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # Public origin for MCP host checks and connection URLs; the deploy workflow passes the site URL.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-}
      # Timestral forecast band (spec 45) stays off on this host (RAM); the statistical anomaly band is used.
      FORECAST_ENABLED: "false"
      # OpenTelemetry (spec 27): traces and metrics go to the Jaeger service below.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: luotsi-gateway
    volumes:
      - gateway_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert r['status'] == 'ok' and r['catalog_rows'] > 0"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  console:
    image: trusted-trade-console:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Demo only: puts the operator token in the public bundle for a one-click sign-in. Leave unset otherwise.
        VITE_DEMO_OPERATOR_TOKEN: ${DEMO_OPERATOR_TOKEN:-}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  jaeger:
    # Trace store and UI. The UI listens on the server's loopback only: open it with
    # `ssh -L 16686:127.0.0.1:16686 <server>` and browse http://localhost:16686.
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "2000"
    mem_limit: 256m
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped
volumes:
  gateway_data:
  caddy_data:
  caddy_config:
